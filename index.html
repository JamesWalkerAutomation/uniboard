<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0057B7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UniBoard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>UniBoard</title>
<style>
:root{--blue:#0057B7;--yellow:#FFD700;--bg:#f5f7fa;--card:#fff;--txt:#1e293b;--mut:#64748b;--line:#e2e8f0;--red:#dc2626;--green:#16a34a;--orange:#ea580c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:17px}header .sub{font-size:11px;opacity:.8}
main{max-width:900px;margin:0 auto;padding:14px;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{background:none;border:none;font-size:10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;position:relative}
nav.bottom button .ic{font-size:20px}nav.bottom button.on{color:var(--blue);font-weight:600}
nav.bottom .badge{position:absolute;top:0;right:2px;background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
@media(min-width:768px){nav.bottom{display:none}main{padding-bottom:30px}nav.top{display:flex!important}.fab{display:none!important}}
nav.top{display:none;position:sticky;top:0;z-index:20;background:var(--blue);padding:0 16px;gap:4px;overflow-x:auto}
nav.top button{background:none;border:none;color:#fff;opacity:.75;padding:12px 14px;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav.top button.on{opacity:1;border-bottom-color:var(--yellow);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:25;width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;border:none;box-shadow:0 4px 14px rgba(0,87,183,.4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
.btn:active{opacity:.8}.btn.sec{background:#eef2f7;color:var(--txt)}.btn.danger{background:#fee2e2;color:var(--red)}.btn.green{background:var(--green)}.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.5}.btn.wide{width:100%}
.input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--txt)}
textarea{resize:vertical}.label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:768px){.grid2{grid-template-columns:1fr 1fr 1fr}}
.chip{display:inline-block;font-size:10px;padding:3px 8px;border-radius:20px;background:#eef2f7;color:var(--mut);margin:2px 2px 2px 0}
.chip.pub{background:#dcfce7;color:#15803d}.chip.err{background:#fee2e2;color:var(--red)}.chip.act{background:#ffedd5;color:var(--orange)}.chip.pend{background:#fef9c3;color:#a16207}.chip.pau{background:#e2e8f0;color:#475569}
.chipf{display:inline-block;padding:6px 12px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:12px;margin:0 6px 6px 0;cursor:pointer}
.chipf.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.h2{font-size:19px;font-weight:700;margin:4px 0 12px}.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}.empty .big{font-size:44px;margin-bottom:10px}
.litem{display:flex;gap:10px;align-items:flex-start}
.litem img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex-shrink:0}
.ltitle{font-weight:600;font-size:14px;line-height:1.3}.lprice{color:var(--mut);font-size:13px;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.mgrid .m{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.mgrid .m img{width:100%;height:100%;object-fit:cover}
.mgrid .m .star{position:absolute;top:4px;left:4px;font-size:14px}
.mgrid .m .del{position:absolute;top:4px;right:4px;background:rgba(220,38,38,.9);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:12px}
.mgrid .m .main{position:absolute;bottom:4px;right:4px;background:rgba(255,255,255,.95);border:none;border-radius:50%;width:26px;height:26px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:768px){.overlay{align-items:center}}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:768px){.modal{border-radius:18px}}
.modal h3{margin:0 0 10px;font-size:17px}
.pre{background:#f1f5f9;border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;max-height:180px;overflow:auto;font-family:ui-monospace,monospace}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:99;background:#1e293b;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}#toast.ok{background:var(--green)}#toast.err{background:var(--red)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:800}.stat .l{font-size:11px;color:var(--mut)}
.sel{width:22px;height:22px;flex-shrink:0;margin-top:2px}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:8px 10px;font-size:12px;margin:6px 0}
.okbox{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:8px 10px;font-size:12px;margin:6px 0}
.errbox{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:10px;padding:10px;font-size:13px;margin:10px 0;white-space:pre-wrap}
.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev .t{color:var(--mut);font-size:11px;white-space:nowrap;padding-top:2px}
.pf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pf:last-child{border:none}.pf .n{font-weight:600;font-size:14px}.pf .d{font-size:11px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.dot.on{background:var(--green)}.dot.off{background:#cbd5e1}
.grp{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
.step{display:flex;gap:10px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;flex-wrap:wrap}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.pubhero{background:linear-gradient(135deg,var(--blue),#0077cc);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.pubhero .p{font-size:26px;font-weight:800}
body.pubmode header,body.pubmode nav,body.pubmode .fab{display:none}
body.pubmode main{padding-bottom:30px}
</style>
</head>
<body>
<header><div><h1>🇺🇦 UniBoard</h1><div class="sub">оголошення всюди — з одного місця</div></div><button class="btn sm" style="background:rgba(255,255,255,.18)" onclick="go('edit',null)">＋ Нове</button></header>
<nav class="top" id="topnav"></nav>
<main id="view"></main>
<button class="fab" onclick="go('edit',null)">＋</button>
<nav class="bottom" id="botnav"></nav>
<div id="modalRoot"></div>
<div id="toast"></div>
<script>
"use strict";
/* АВАРІЙНИЙ ЕКРАН: будь-яка помилка стане видимою */
window.addEventListener('error',function(e){showErr('Помилка: '+(e.message||'невідома')+' (рядок '+(e.lineno||'?')+')');});
function showErr(msg){var v=document.getElementById('view');if(v)v.innerHTML='<div class="errbox">❌ '+msg+'\n\nСфотографуйте цей текст і надішліть розробнику.</div>';}
/* ===== СХОВИЩЕ ===== */
var STORES=['listings','media','publications','messages','events','kv'];
var _db=null;
function idb(){if(_db)return _db;_db=new Promise(function(res,rej){var r=indexedDB.open('uniboard4',1);
r.onupgradeneeded=function(e){var d=e.target.result;STORES.forEach(function(s){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='kv'?'key':'id',autoIncrement:s!=='kv'});});};
r.onsuccess=function(e){res(e.target.result);};r.onerror=function(e){rej(e.target.error);};});return _db;}
function rq(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function os(s,m){return idb().then(function(d){return d.transaction(s,m||'readonly').objectStore(s);});}
var DB={};
DB.all=function(s){return os(s).then(function(o){return rq(o.getAll());});};
DB.get=function(s,id){return os(s).then(function(o){return rq(o.get(id));});};
DB.put=function(s,v){return os(s,'readwrite').then(function(o){return rq(o.put(v));});};
DB.del=function(s,id){return os(s,'readwrite').then(function(o){return rq(o.delete(id));});};
DB.clear=function(s){return os(s,'readwrite').then(function(o){return rq(o.clear());});};
function kvGet(k,d){return DB.get('kv',k).then(function(r){return r?r.value:d;});}
function kvSet(k,v){return DB.put('kv',{key:k,value:v});}
/* ===== ДОВІДНИКИ ===== */
var CATS=['Електроніка','Транспорт','Нерухомість','Одяг та взуття','Дім і сад','Дитячий світ','Тварини','Робота','Послуги','Хобі','Інше'];
var PL=[
{code:'telegram',name:'Telegram',grp:'auto',icon:'✈️',desc:'Bot API: автопублікація з фото + вхідні повідомлення та відповіді',fields:[['token','Bot Token (від @BotFather)'],['chat','Chat ID каналу/групи']]},
{code:'discord',name:'Discord',grp:'auto',icon:'🎮',desc:'Webhook: автопублікація з фото у канал спільноти',fields:[['webhook','URL Webhook (Settings → Integrations)']]},
{code:'mastodon',name:'Mastodon',grp:'auto',icon:'🐘',desc:'API: автопублікація посту (текст)',fields:[['instance','Інстанція, напр. https://mastodon.social'],['token','Access Token']]},
{code:'fb_share',name:'Facebook',grp:'share',icon:'📘',desc:'Пост/групи через шеринг з публічним посиланням',share:'https://www.facebook.com/sharer/sharer.php?u={U}&quote={T}'},
{code:'x',name:'X (Twitter)',grp:'share',icon:'🐦',desc:'Твіт з посиланням на оголошення',share:'https://twitter.com/intent/tweet?text={T}&url={U}'},
{code:'wa',name:'WhatsApp',grp:'share',icon:'💚',desc:'У чат/групу/статус',share:'https://api.whatsapp.com/send?text={T}%20{U}'},
{code:'viber',name:'Viber',grp:'share',icon:'💜',desc:'Переслати у чат/спільноту',share:'viber://forward?text={T}%20{U}'},
{code:'tg_share',name:'Telegram-шеринг',grp:'share',icon:'✈️',desc:'У будь-який чат/канал',share:'https://t.me/share/url?url={U}&text={T}'},
{code:'sms',name:'SMS',grp:'share',icon:'💬',desc:'Текст + посилання',share:'sms:?body={T}%20{U}'},
{code:'mail',name:'Email',grp:'share',icon:'✉️',desc:'Лист з посиланням',share:'mailto:?subject={T}&body={T}%20{U}'},
{code:'olx',name:'OLX.ua',grp:'manual',icon:'🟢',desc:'Дошка №1 · керований процес',url:'https://www.olx.ua/uk/post-new-ad/'},
{code:'izi',name:'IZI.ua',grp:'manual',icon:'🛒',desc:'Маркетплейс · керований процес',url:'https://izi.ua/uk/new/'},
{code:'prom',name:'Prom.ua',grp:'manual',icon:'🏷️',desc:'Маркетплейс товарів',url:'https://my.prom.ua/cabinet/products/create'},
{code:'shafa',name:'Shafa.ua',grp:'manual',icon:'👗',desc:'Одяг/взуття',url:'https://shafa.ua/cabinet/products/create'},
{code:'fb_market',name:'FB Marketplace',grp:'manual',icon:'🏪',desc:'Маркетплейс Facebook',url:'https://www.facebook.com/marketplace/create/item'},
{code:'kidstaff',name:'Kidstaff',grp:'manual',icon:'🧸',desc:'Дитячі товари',url:'https://kidstaff.com.ua/sozdaniye-objavlenije.html'},
{code:'crafta',name:'Crafta.ua',grp:'manual',icon:'🎨',desc:'Ручна робота',url:'https://crafta.ua/cabinet/products/create'},
{code:'besplatka',name:'Besplatka.ua',grp:'manual',icon:'📰',desc:'Дошка оголошень',url:'https://besplatka.ua/board/post'},
{code:'flagma',name:'Flagma.ua',grp:'manual',icon:'🏭',desc:'B2B дошка',url:'https://flagma.ua/add/'}];
var STATUS={draft:['Чернетка',''],published:['Опубліковано','pub'],needs_action:['Потребує дії','act'],error:['Помилка','err'],publishing:['Публікується','pend'],paused:['Призупинено','pau']};
/* ===== СТАН ===== */
var L=[],MED=[],PUB=[],MSG=[],EV=[],CONN={},AUTOPOLL=false;
var PROFILE={name:'',phone:'',email:'',city:'',delivery:'',tg:''};
var page='listings',sel=[],viewMode='card',search='',fSt='all',sortB='new',editing=null,editMedia=[],pubIds=[],pubSel=[];
var _TK=[],_TR=[];
var urlCache={};
function murl(m){if(!urlCache[m.id])urlCache[m.id]=URL.createObjectURL(m.blob);return urlCache[m.id];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='show '+(t||'');clearTimeout(e._h);e._h=setTimeout(function(){e.className='';},2600);}
function fmtd(d){return new Date(d).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function loadAll(){return Promise.all([DB.all('listings'),DB.all('media'),DB.all('publications'),DB.all('messages'),DB.all('events')]).then(function(r){L=r[0];MED=r[1];PUB=r[2];MSG=r[3];EV=r[4];return Promise.all([kvGet('conn',{}),kvGet('profile',null),kvGet('tg_autopoll',false)]);}).then(function(r){CONN=r[0]||{};if(r[1])PROFILE=r[1];AUTOPOLL=!!r[2];sortListings();});}
function sortListings(){L.sort(function(a,b){return sortB==='price'?a.price-b.price:b.createdAt-a.createdAt;});}
function log(t,m){var r={type:t,message:m,at:Date.now()};EV.unshift(r);DB.put('events',r);if(EV.length>200)EV=EV.slice(0,200);}
function mediaOf(id){return MED.filter(function(m){return m.listingId===id;}).sort(function(a,b){return a.pos-b.pos;});}
function pubsOf(id){return PUB.filter(function(p){return p.listingId===id;});}
function plOf(c){return PL.find(function(p){return p.code===c;})||{name:c,icon:'❓'};}
/* ===== МОДАЛКИ ===== */
function showModal(h){document.getElementById('modalRoot').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+h+'</div></div>';}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
var _cRes=null;
function cAsk(m){return new Promise(function(r){_cRes=r;showModal('<h3>Підтвердження</h3><p style="margin:8px 0 16px">'+esc(m)+'</p><div class="row"><button class="btn sec" onclick="cDone(false)">Скасувати</button><button class="btn danger" onclick="cDone(true)">Так</button></div>');});}
function cDone(v){closeModal();if(_cRes)_cRes(v);_cRes=null;}
/* ===== НАВІГАЦІЯ ===== */
var NAV=[['listings','📋','Оголошення'],['platforms','🌐','Платформи'],['messages','💬','Чати'],['stats','📊','Статистика'],['profile','👤','Ще']];
function go(p,id){page=p;if(p==='edit'){editing=(id==null?null:id);prepEdit();}closeModal();render();window.scrollTo(0,0);}
function renderNav(){var un=MSG.filter(function(m){return !m.read;}).length;
document.getElementById('botnav').innerHTML=NAV.map(function(n){var id=n[0];return '<button class="'+((page===id||(id==='listings'&&page==='edit'))?'on':'')+'" onclick="go(\''+id+'\')"><span class="ic">'+n[1]+'</span>'+n[2]+(id==='messages'&&un?'<span class="badge">'+un+'</span>':'')+'</button>';}).join('');
document.getElementById('topnav').innerHTML=NAV.map(function(n){var id=n[0];return '<button class="'+((page===id||(id==='listings'&&page==='edit'))?'on':'')+'" onclick="go(\''+id+'\')">'+n[1]+' '+n[2]+(id==='messages'&&un?' ('+un+')':'')+'</button>';}).join('');}
function render(){try{renderNav();var v=document.getElementById('view');
if(page==='listings')v.innerHTML=vListings();
else if(page==='edit')v.innerHTML=vEdit();
else if(page==='platforms')v.innerHTML=vPlatforms();
else if(page==='messages')v.innerHTML=vMessages();
else if(page==='stats')v.innerHTML=vStats();
else if(page==='events')v.innerHTML=vEvents();
else v.innerHTML=vProfile();}catch(e){showErr('render: '+e.message);}}
function maybeOnboard(){kvGet('onboard',false).then(function(done){if(done)return;
showModal('<div style="text-align:center;padding:10px 0"><div style="font-size:52px">🇺🇦</div><h3 style="margin:8px 0">Вітаємо в UniBoard!</h3><p class="mut">1️⃣ Створіть оголошення з фото<br>2️⃣ Оберіть платформи (19 доступних)<br>3️⃣ Додаток адаптує текст і опублікує<br><br>⚡ Telegram, Discord, Mastodon — автоматично<br>📤 Facebook, WhatsApp, Viber... — один дотик<br>📋 OLX, IZI, Prom... — крок за кроком</p><button class="btn wide" style="margin-top:10px" onclick="kvSet(\'onboard\',true);closeModal()">Почнемо 🚀</button></div>');});}
/* ===== СПИСОК ===== */
function vListings(){
var items=L;
if(search)items=items.filter(function(l){return (l.title+' '+l.description).toLowerCase().indexOf(search.toLowerCase())>=0;});
if(fSt==='draft')items=items.filter(function(l){return !pubsOf(l.id).length;});
else if(fSt!=='all')items=items.filter(function(l){return pubsOf(l.id).some(function(p){return p.status===fSt;})||(fSt==='paused'&&l.status==='paused');});
var chips=[['all','Всі '+L.length],['draft','Чернетки'],['published','Опубліковані'],['needs_action','Потребує дії'],['error','Помилки'],['paused','Призупинені']];
var h='<div class="row" style="margin-bottom:8px"><input class="input" placeholder="🔍 Пошук..." value="'+esc(search)+'" oninput="search=this.value;render()"><select class="input" style="max-width:130px" onchange="sortB=this.value;sortListings();render()"><option value="new"'+(sortB==='new'?' selected':'')+'>Нові</option><option value="price"'+(sortB==='price'?' selected':'')+'>За ціною</option></select></div>';
h+='<div>'+chips.map(function(c){return '<span class="chipf'+(fSt===c[0]?' on':'')+'" onclick="fSt=\''+c[0]+'\';render()">'+c[1]+'</span>';}).join('')+'</div>';
if(sel.length)h+='<div class="card" style="background:#eff6ff"><div class="row"><button class="btn sm green" onclick="openPublish(sel)">▶ ('+sel.length+')</button><button class="btn sm" style="background:#fef9c3;color:#a16207" onclick="bulkPause()">⏸</button><button class="btn sm danger" onclick="bulkDelete()">🗑</button><button class="btn sm sec" onclick="sel=[];render()">✕</button></div></div>';

function thumbData(m,max,q){return new Promise(function(res){var i=new Image();i.onload=function(){var w=i.width,h=i.height;var r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',q));};i.onerror=function(){res(null);};i.src=murl(m);});}
function b64u(u){var s='';u.forEach(function(b){s+=String.fromCharCode(b);});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s);var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function pubLink(l){var ms=mediaOf(l.id).filter(function(m){return m.type==='image';});
var chain=Promise.resolve([]);
if(ms.length)chain=thumbData(ms[0],360,0.6).then(function(t){return t?[t]:[];});
return chain.then(function(ph){var o={t:l.title,d:l.description,p:l.price,c:l.currency,cat:l.category,loc:l.location,ct:{ph:PROFILE.phone,em:PROFILE.email,tg:PROFILE.tg},ph:ph};
var j=JSON.stringify(o);
if(typeof CompressionStream!=='undefined'){var c=new CompressionStream('gzip');var w=c.writable.getWriter();w.write(new TextEncoder().encode(j));w.close();
return new Response(c.readable).arrayBuffer().then(function(ab){return location.origin+location.pathname+'#v=g'+b64u(new Uint8Array(ab));});}
return location.origin+location.pathname+'#v=u'+b64u(new TextEncoder().encode(j));});}
function decodeLink(s){var pref=s[0],rest=s.slice(1);
if(pref==='g'){var c=new DecompressionStream('gzip');var w=c.writable.getWriter();w.write(unb64u(rest));w.close();return new Response(c.readable).text();}
return Promise.resolve(new TextDecoder().decode(unb64u(rest)));}

DB.get('listings',pubIds[0]).then(function(l){var h='<h3>Попередній перегляд</h3>';
pubSel.forEach(function(code){var p=plOf(code);var a=adapt(l,code);
h+='<div class="card"><b>'+p.icon+' '+p.name+'</b>'+(p.grp==='auto'?'<div class="okbox">⚡ Буде опубліковано автоматично</div>':p.grp==='share'?'<div class="okbox">📤 Відкриється шеринг з публічним посиланням</div>':'<div class="warn">📋 Скопіюємо текст і відкриємо сайт — ви завершите публікацію кроками</div>')+(a.warn.length?a.warn.map(function(x){return '<div class="warn">⚠️ '+x+'</div>';}).join(''):'')+'<div class="pre">'+esc(a.text)+'</div></div>';});
h+='<div class="row"><button class="btn sec" onclick="openPublish(pubIds)">← Назад</button><button class="btn green" onclick="runPublish()">✅ Підтвердити</button></div>';showModal(h);});}
function runPublish(){closeModal();toast('Публікація...');var manualLid=null;var p=Promise.resolve();
pubIds.forEach(function(lid){pubSel.forEach(function(code){p=p.then(function(){return DB.get('listings',lid).then(function(l){return doPublishOne(l,code,null);}).then(function(r){if(r==='manual')manualLid=lid;});});});});
p.then(function(){sel=[];return loadAll();}).then(render).then(function(){if(manualLid)openManual(manualLid);toast('Готово. Перевірте статуси','ok');});}
function doPublishOne(l,code,ex){var p=plOf(code);var rec=ex?Object.assign({},ex):{listingId:l.id,platformCode:code,createdAt:Date.now()};
rec.status='publishing';rec.error=null;
return DB.put('publications',rec).then(function(pid){rec.id=pid;
var a=adapt(l,code);var ms=mediaOf(l.id).filter(function(m){return m.type==='image';});var chain=Promise.resolve();
if(p.grp==='auto'){
 if(code==='telegram')chain=tgSend(CONN.telegram,a.text,ms.map(function(m){return m.blob;})).then(function(mid){rec.status='published';rec.externalId=String(mid);log('publish','⚡ Telegram: '+l.title);});
 else if(code==='discord')chain=dcSend(CONN.discord.webhook,a.text,ms.map(function(m){return m.blob;})).then(function(){rec.status='published';log('publish','⚡ Discord: '+l.title);});
 else if(code==='mastodon')chain=maSend(CONN.mastodon.instance,CONN.mastodon.token,a.text).then(function(u){rec.status='published';rec.externalUrl=u;log('publish','⚡ Mastodon: '+l.title);});
}else if(p.grp==='share'){chain=pubLink(l).then(function(u){var t=l.title+' — '+l.price+' '+l.currency;var url=p.share.replace('{U}',encodeURIComponent(u)).replace('{T}',encodeURIComponent(t));window.open(url,'_blank');rec.status='published';rec.externalUrl=url;rec.adapted=a.text;log('publish','📤 '+p.name+': '+l.title);});}
else{chain=Promise.resolve().then(function(){if(navigator.clipboard)return navigator.clipboard.writeText(a.text).catch(function(){});}).then(function(){rec.status='needs_action';rec.externalUrl=p.url;rec.adapted=a.text;log('publish','📋 '+p.name+': '+l.title);});}
return chain.catch(function(e){rec.status='error';rec.error=String(e.message||e);log('error','❌ '+p.name+': '+rec.error);}).then(function(){rec.updatedAt=Date.now();return DB.put('publications',rec);}).then(function(){return rec.status==='needs_action'?'manual':rec.status;});});}
function openManual(lid){var ps=pubsOf(lid).filter(function(p){return p.status==='needs_action';});if(!ps.length)return;
showModal('<h3>📋 Завершення публікації</h3><p class="mut">Текст уже скопійовано. Виконайте кроки:</p>'+ps.map(function(p){var pf=plOf(p.platformCode);
return '<div class="card"><b>'+pf.icon+' '+pf.name+'</b><div class="step"><span class="num">1</span><button class="btn sm sec" onclick="copyPub('+p.id+')">📋 Текст</button><button class="btn sm sec" onclick="savePhotos('+p.listingId+')">📷 Фото</button></div><div class="step"><span class="num">2</span><button class="btn sm" onclick="window.open(\''+p.externalUrl+'\')">↗ Відкрити сайт і вставити</button></div><div class="step"><span class="num">3</span><button class="btn sm green" onclick="markPub('+p.id+',\'published\');closeModal()">✅ Я опублікував</button><button class="btn sm danger" onclick="markPub('+p.id+',\'error\');closeModal()">✕ Не вийшло</button></div></div>';}).join(''));}
/* ===== АВТО-АДАПТЕРИ ===== */
function tgSend(c,text,blobs){var F=function(m){return 'https://api.telegram.org/bot'+c.token+'/'+m;};
if(blobs.length===1){var fd=new FormData();fd.append('chat_id',c.chat);fd.append('caption',text);fd.append('parse_mode','HTML');fd.append('photo',blobs[0],'photo.jpg');return fetch(F('sendPhoto'),{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(d){if(!d.ok)throw new Error(d.description);return d.result.message_id;});}
if(blobs.length>1){var fd2=new FormData();fd2.append('chat_id',c.chat);var mj=[];blobs.slice(0,10).forEach(function(b,i){var fn='f'+i;fd2.append(fn,b,fn+'.jpg');mj.push(i===0?{type:'photo',media:'attach://'+fn,caption:text,parse_mode:'HTML'}:{type:'photo',media:'attach://'+fn});});fd2.append('media',JSON.stringify(mj));return fetch(F('sendMediaGroup'),{method:'POST',body:fd2}).then(function(r){return r.json();}).then(function(d){if(!d.ok)throw new Error(d.description);return d.result[0].message_id;});}
return fetch(F('sendMessage'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:c.chat,text:text,parse_mode:'HTML'})}).then(function(r){return r.json();}).then(function(d){if(!d.ok)throw new Error(d.description);return d.result.message_id;});}
function dcSend(hook,text,blobs){if(blobs.length){var fd=new FormData();fd.append('payload_json',JSON.stringify({content:text.slice(0,2000)}));blobs.slice(0,10).forEach(function(b,i){fd.append('files['+i+']',b,'photo.jpg');});return fetch(hook,{method:'POST',body:fd}).then(function(r){if(!r.ok)throw new Error('Discord '+r.status);});}
return fetch(hook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text.slice(0,2000)})}).then(function(r){if(!r.ok)throw new Error('Discord '+r.status);});}
function maSend(inst,token,text){return fetch(inst.replace(/\/$/,'')+'/api/v1/statuses',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({status:text})}).then(function(r){if(!r.ok)throw new Error('Mastodon '+r.status);return r.json();}).then(function(d){return d.url;});}
/* ===== ПЛАТФОРМИ ===== */
function vPlatforms(){function grp(g,ttl){return '<div class="grp">'+ttl+'</div>'+PL.filter(function(p){return p.grp===g;}).map(function(p){var c=CONN[p.code];
return '<div class="card"><div class="pf" style="border:none;padding:0"><div><span class="dot '+(c&&c.on?'on':'off')+'"></span><span class="n">'+p.icon+' '+p.name+'</span><div class="d">'+p.desc+'</div></div>'+(p.grp==='auto'?(c&&c.on?'<button class="btn sm danger" onclick="disConn(\''+p.code+'\')">Відключити</button>':'<button class="btn sm" onclick="connForm(\''+p.code+'\')">Підключити</button>'):'<span class="chip '+(p.grp==='share'?'pub':'act')+'">'+(p.grp==='share'?'1 дотик':'кроки')+'</span>')+'</div></div>';}).join('');}
return '<div class="h2">Платформи</div><p class="mut" style="margin:-6px 0 10px">⚡ потребують підключення · 📤 та 📋 працюють одразу</p>'+grp('auto','⚡ Автоматична публікація')+grp('share','📤 Шеринг одним дотиком')+grp('manual','📋 Керовані ручні');}
function connForm(code){var p=plOf(code);
showModal('<h3>'+p.icon+' '+p.name+'</h3><p class="mut">'+p.desc+'</p>'+(p.fields||[]).map(function(f){return '<label class="label">'+f[1]+'</label><input class="input" id="cf_'+f[0]+'">';}).join('')+'<div class="row" style="margin-top:14px"><button class="btn sec" onclick="closeModal()">Скасувати</button><button class="btn" onclick="doConn(\''+code+'\')">Підключити</button></div>');}
function doConn(code){var c={on:true};(plOf(code).fields||[]).forEach(function(f){c[f[0]]=document.getElementById('cf_'+f[0]).value.trim();});
toast('Перевірка...');var chain=Promise.resolve();
if(code==='telegram')chain=fetch('https://api.telegram.org/bot'+c.token+'/getMe').then(function(r){return r.json();}).then(function(d){if(!d.ok)throw new Error(d.description);c.name=d.result.first_name;});
if(code==='discord')chain=fetch(c.webhook).then(function(r){if(!r.ok)throw new Error('Webhook '+r.status);});
if(code==='mastodon')chain=fetch(c.instance.replace(/\/$/,'')+'/api/v1/accounts/verify_credentials',{headers:{'Authorization':'Bearer '+c.token}}).then(function(r){if(!r.ok)throw new Error('Mastodon '+r.status);});
chain.then(function(){CONN[code]=c;return kvSet('conn',CONN);}).then(function(){log('connect','Підключено: '+plOf(code).name);closeModal();render();toast('Підключено','ok');if(code==='telegram')startPoll();}).catch(function(e){toast('Помилка: '+e.message,'err');});}
function disConn(code){delete CONN[code];kvSet('conn',CONN).then(function(){render();toast('Відключено');});}
/* ===== ПОВІДОМЛЕННЯ ===== */
var pollTimer=null;
function startPoll(){if(pollTimer)clearInterval(pollTimer);if(CONN.telegram&&CONN.telegram.on&&AUTOPOLL)pollTimer=setInterval(function(){tgPoll(true);},60000);}
function vMessages(){var h='<div class="h2">Повідомлення</div>';
if(CONN.telegram&&CONN.telegram.on)h+='<div class="card"><div class="pf" style="border:none;padding:0"><div><span class="n">✈️ Автоопитування Telegram</span><div class="d">Кожні 60 с, поки додаток відкрито</div></div><button class="btn sm '+(AUTOPOLL?'green':'sec')+'" onclick="togglePoll()">'+(AUTOPOLL?'Увімкнено':'Увімкнути')+'</button></div><button class="btn sec wide" style="margin-top:8px" onclick="tgPoll(false)">🔄 Отримати зараз</button></div>';
else h+='<div class="warn">💬 Вхідні повідомлення підтримує Telegram. Підключіть бота на вкладці «Платформи».</div>';
var keys=[];MSG.forEach(function(m){var k=m.platform+'|'+m.sender;if(keys.indexOf(k)<0)keys.push(k);});_TK=keys;
if(!MSG.length)h+='<div class="empty"><div class="big">💬</div>Поки немає повідомлень</div>';
else h+=keys.map(function(k,i){var arr=MSG.filter(function(m){return (m.platform+'|'+m.sender)===k;});var last=arr[arr.length-1];var un=arr.some(function(m){return !m.read;});
return '<div class="card" style="'+(un?'background:#eff6ff':'')+'" onclick="openThread('+i+')"><div class="pf" style="border:none;padding:0"><div><span class="n">'+(un?'🔵 ':'')+esc(last.sender)+'</span><div class="d">'+esc(last.platform)+' · '+fmtd(last.at)+' · '+arr.length+' повід.</div><div style="margin-top:4px;font-size:13px">'+esc(String(last.text).slice(0,80))+'</div></div><span style="font-size:20px;color:var(--mut)">›</span></div></div>';}).join('');
return h;}
function togglePoll(){AUTOPOLL=!AUTOPOLL;kvSet('tg_autopoll',AUTOPOLL).then(function(){if(AUTOPOLL)startPoll();render();toast(AUTOPOLL?'Автоопитування увімкнено':'Вимкнено','ok');});}
function openThread(i){var arr=MSG.filter(function(m){return (m.platform+'|'+m.sender)===_TK[i];});_TR=arr;
Promise.all(arr.filter(function(m){return !m.read;}).map(function(m){m.read=true;return DB.put('messages',m);})).then(function(){loadAll().then(renderNav);});
var canReply=arr[0].platform==='Telegram'&&CONN.telegram&&CONN.telegram.on&&arr[0].chatId;
showModal('<h3>'+esc(arr[0].sender)+'</h3><div style="max-height:45vh;overflow:auto">'+arr.map(function(m){return '<div class="card" style="margin:6px 0;'+(m.out?'background:#eff6ff':'')+'"><div class="mut" style="font-size:10px">'+(m.out?'Ви → ':'')+fmtd(m.at)+'</div>'+esc(m.text)+'</div>';}).join('')+'</div>'+
(canReply?'<div class="row" style="margin-top:10px"><input class="input" id="rep" placeholder="Ваша відповідь..."><button class="btn" onclick="sendReplyNow()">➤</button></div>':'<p class="mut" style="margin-top:8px">Відповідь можлива через Telegram-бот або на платформі покупця.</p>');}
function sendReplyNow(){var el=document.getElementById('rep');var t=el?el.value.trim():'';if(!t||!_TR.length)return;
tgSend(CONN.telegram,t,[]).then(function(){return DB.put('messages',{platform:'Telegram',sender:_TR[0].sender,text:t,read:true,out:true,chatId:_TR[0].chatId,at:Date.now()});}).then(function(){closeModal();return loadAll();}).then(render).then(function(){toast('Надіслано','ok');}).catch(function(e){toast(e.message,'err');});}
function tgPoll(silent){var c=CONN.telegram;if(!c||!c.on)return Promise.resolve();
return kvGet('tg_offset',0).then(function(off){return fetch('https://api.telegram.org/bot'+c.token+'/getUpdates?offset='+off+'&limit=50').then(function(r){return r.json();}).then(function(d){if(!d.ok)throw new Error(d.description);var n=0;var p=Promise.resolve();
d.result.forEach(function(u){off=u.update_id+1;var m=u.message||u.channel_post;
if(m&&m.text&&!m.from.is_bot){n++;p=p.then(function(){return DB.put('messages',{platform:'Telegram',sender:((m.chat.first_name||m.chat.title||'')+' '+(m.chat.last_name||'')).trim(),text:m.text,read:false,chatId:m.chat.id,at:m.date*1000});});}});
return p.then(function(){return kvSet('tg_offset',off);}).then(function(){return loadAll();}).then(function(){renderNav();if(!silent){render();toast(n?'Нових повідомлень: '+n:'Немає нових','ok');}});});}).catch(function(e){if(!silent)toast(e.message,'err');});}
/* ===== СТАТИСТИКА / ПОДІЇ / ПРОФІЛЬ ===== */
function vStats(){var byPl={};PUB.forEach(function(p){byPl[p.platformCode]=(byPl[p.platformCode]||0)+1;});
var mx=Math.max.apply(null,[1].concat(Object.values(byPl)));
var cards=[['L.length','Оголошень'],['L.filter(function(l){return l.status!==\'paused\';}).length','Активних'],['PUB.length','Публікацій'],['PUB.filter(function(p){return p.status===\'published\';}).length','Успішних'],['PUB.filter(function(p){return p.status===\'error\';}).length','Помилок'],['MSG.filter(function(m){return !m.read;}).length','Нових повід.']];
return '<div class="h2">Статистика</div><div class="grid2" style="grid-template-columns:repeat(3,1fr)">'+cards.map(function(c){return '<div class="stat"><div class="v">'+eval(c[0])+'</div><div class="l">'+c[1]+'</div></div>';}).join('')+'</div>'+
'<div class="card" style="margin-top:12px"><b style="font-size:13px">По платформах</b>'+Object.keys(byPl).map(function(c){var p=plOf(c);var n=byPl[c];return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>'+p.icon+' '+esc(p.name)+'</span><span>'+n+'</span></div><div style="background:#e2e8f0;height:8px;border-radius:4px;margin-top:3px"><div style="background:var(--blue);height:8px;border-radius:4px;width:'+Math.round(n/mx*100)+'%"></div></div></div>';}).join('')||'<div class="mut">Немає даних</div>'+'</div>';}
function vEvents(){return '<div class="h2">Журнал подій</div>'+(EV.length?EV.map(function(e){return '<div class="ev"><span class="t">'+fmtd(e.at)+'</span><span>'+esc(e.message)+'</span></div>';}).join(''):'<div class="empty">Подій немає</div>');}
var deferredPrompt=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;});
function installApp(){if(deferredPrompt)deferredPrompt.prompt();}
function vProfile(){return '<div class="h2">Профіль</div><div class="card">'+
'<label class="label">Ім\'я</label><input class="input" value="'+esc(PROFILE.name)+'" oninput="PROFILE.name=this.value">'+
'<label class="label">Телефон</label><input class="input" value="'+esc(PROFILE.phone)+'" oninput="PROFILE.phone=this.value">'+
'<label class="label">Telegram-нік (для публічних посилань)</label><input class="input" value="'+esc(PROFILE.tg)+'" placeholder="@username" oninput="PROFILE.tg=this.value">'+
'<label class="label">Email</label><input class="input" value="'+esc(PROFILE.email)+'" oninput="PROFILE.email=this.value">'+
'<label class="label">Місто</label><input class="input" value="'+esc(PROFILE.city)+'" oninput="PROFILE.city=this.value">'+
'<label class="label">Доставка</label><input class="input" value="'+esc(PROFILE.delivery)+'" oninput="PROFILE.delivery=this.value">'+
'<button class="btn wide" style="margin-top:12px" onclick="saveProfile()">💾 Зберегти</button></div>'+
'<div class="card"><b style="font-size:13px">📲 Встановити додаток</b><div class="mut" style="margin:6px 0">Android: ⋮ → «Додати на головний екран» · iOS: Поділитися → «На головний екран»</div>'+(deferredPrompt?'<button class="btn wide" onclick="installApp()">📲 Встановити</button>':'<div class="mut">Використовуйте меню браузера</div>')+'</div>'+
'<div class="card"><b style="font-size:13px">💾 Резервна копія</b><div class="mut" style="margin:6px 0">Перенесення між пристроями</div><div class="row"><button class="btn sec" onclick="exportBackup()">⬇ Експорт</button><button class="btn sec" onclick="document.getElementById(\'imp\').click()">⬆ Імпорт</button></div><input type="file" id="imp" accept=".json" style="display:none" onchange="importBackup(this.files[0])"></div>'+
'<div class="card"><button class="btn sec wide" onclick="go(\'events\')">📜 Журнал подій</button></div><div class="mut" style="text-align:center">UniBoard v4.1 · 19 платформ · офлайн</div>';}
function saveProfile(){kvSet('profile',PROFILE).then(function(){toast('Збережено','ok');});}
function exportBackup(){var d={listings:L,publications:PUB,messages:MSG,events:EV,profile:PROFILE,conn:CONN,media:[]};
var p=Promise.resolve();MED.forEach(function(m){p=p.then(function(){return new Promise(function(r){var f=new FileReader();f.onload=function(){d.media.push(Object.assign({},m,{dataUrl:f.result}));r();};f.readAsDataURL(m.blob);});});});
p.then(function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='uniboard-backup.json';a.click();toast('Копію завантажено','ok');});}
function importBackup(f){cAsk('Імпорт замінить поточні дані?').then(function(ok){if(!ok)return;
f.text().then(function(t){var d=JSON.parse(t);var p=Promise.resolve();STORES.forEach(function(s){p=p.then(function(){return DB.clear(s);});});
(d.listings||[]).forEach(function(x){p=p.then(function(){return DB.put('listings',x);});});
(d.publications||[]).forEach(function(x){p=p.then(function(){return DB.put('publications',x);});});
(d.messages||[]).forEach(function(x){p=p.then(function(){return DB.put('messages',x);});});
(d.events||[]).forEach(function(x){p=p.then(function(){return DB.put('events',x);});});
(d.media||[]).forEach(function(m){p=p.then(function(){return fetch(m.dataUrl).then(function(r){return r.blob();}).then(function(bl){return DB.put('media',Object.assign({},m,{blob:bl}));});});});
p.then(function(){return kvSet('profile',d.profile||{});}).then(function(){return kvSet('conn',d.conn||{});}).then(function(){return loadAll();}).then(render).then(function(){toast('Імпортовано','ok');});});});}
/* ===== СТАРТ ===== */
(function(){
if(location.protocol.indexOf('http')===0&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
var boot=Promise.resolve();
if(location.hash.indexOf('#v=')===0){boot=decodeLink(location.hash.slice(3)).then(function(t){return JSON.parse(t);}).then(function(o){return loadAll().then(function(){renderPublic(o);});}).catch(function(){location.hash='';return loadAll().then(render);});}
else boot=loadAll().then(render);
boot.then(function(){maybeOnboard();startPoll();}).catch(function(e){showErr('start: '+e.message);});
})();
</script>
