<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UniBoard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>UniBoard</title>
<style>
:root{
 --pri:#4F46E5; --pri2:#06B6D4; --soft:#EEF0FF;
 --bg:#F4F5FA; --card:#FFFFFF; --txt:#0F172A;
 --mut:#64748B; --line:#E5E7EB;
 --ok:#16A34A; --err:#DC2626; --warn:#D97706;
 --sh:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0; font-size:15px; color:var(--txt);
 background:var(--bg);
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',
  Roboto,sans-serif;
}
header{
 position:sticky; top:0; z-index:20; background:#fff;
 border-bottom:1px solid var(--line);
 padding:10px 16px;
 padding-top:calc(10px + env(safe-area-inset-top));
 display:flex; align-items:center;
 justify-content:space-between;
}
.hwrap{display:flex;align-items:center;gap:9px}
.logo{width:26px;height:26px}
.hname{font-weight:800;font-size:17px;letter-spacing:.2px}
main{
 max-width:900px; margin:0 auto; padding:14px;
 padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
nav.bottom{
 position:fixed; bottom:0; left:0; right:0; z-index:20;
 background:#fff; border-top:1px solid var(--line);
 display:flex; justify-content:space-around; padding:6px 4px;
 padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
nav.bottom button{
 background:none; border:none; font-size:10px;
 color:var(--mut); display:flex; flex-direction:column;
 align-items:center; gap:2px; padding:5px 10px;
 position:relative; border-radius:12px; min-width:56px;
}
nav.bottom button .ic{font-size:21px;line-height:1}
nav.bottom button.on{color:var(--pri);font-weight:700}
nav.bottom button.on .ic{
 background:var(--soft); border-radius:12px; padding:2px 10px;
}
nav.bottom .badge{
 position:absolute; top:1px; right:6px; background:var(--err);
 color:#fff; font-size:9px; min-width:15px; height:15px;
 border-radius:8px; display:flex; align-items:center;
 justify-content:center; padding:0 3px;
}
nav.top{
 display:none; position:sticky; top:53px; z-index:19;
 background:#fff; border-bottom:1px solid var(--line);
 padding:0 16px; gap:4px; overflow-x:auto;
}
nav.top button{
 background:none; border:none; color:var(--mut);
 padding:12px 14px; font-size:14px; white-space:nowrap;
 border-bottom:3px solid transparent;
}
nav.top button.on{
 color:var(--pri); border-bottom-color:var(--pri);
 font-weight:700;
}
@media(min-width:768px){
 nav.bottom{display:none}
 main{padding-bottom:30px}
 nav.top{display:flex!important}
}
.card{
 background:var(--card); border:1px solid var(--line);
 border-radius:16px; padding:14px; margin-bottom:12px;
 box-shadow:var(--sh);
}
.gtitle{
 font-size:12px; font-weight:700; color:var(--mut);
 text-transform:uppercase; letter-spacing:.6px;
 margin:0 0 8px;
}
.btn{
 display:inline-flex; align-items:center;
 justify-content:center; gap:6px; border:none;
 border-radius:12px; padding:12px 18px; font-size:14px;
 font-weight:600; cursor:pointer; background:var(--pri);
 color:#fff; min-height:44px;
}
.btn:active{opacity:.85}
.btn.sec{background:#F1F2F6;color:var(--txt)}
.btn.danger{background:#FEF2F2;color:var(--err)}
.btn.green{background:var(--ok)}
.btn.sm{padding:8px 14px;font-size:13px;min-height:38px}
.btn:disabled{opacity:.5}
.btn.wide{width:100%}
.input,select,textarea{
 width:100%; border:1px solid var(--line); border-radius:12px;
 padding:11px 12px; font-size:16px; font-family:inherit;
 background:#fff; color:var(--txt); min-height:44px;
}
textarea{resize:vertical;font-size:15px}
.label{
 display:block; font-size:12px; font-weight:600;
 color:var(--mut); margin:10px 0 4px;
}
.row{display:flex;gap:8px}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:768px){.grid2{grid-template-columns:1fr 1fr 1fr}}
.sbox{position:relative;flex:1}
.sbox .si{
 position:absolute; left:11px; top:50%;
 transform:translateY(-50%); color:var(--mut);
 font-size:14px; pointer-events:none;
}
.sbox .input{padding-left:34px}
.chipsrow{
 display:flex; overflow-x:auto; gap:6px;
 padding-bottom:4px; margin-bottom:8px;
 scrollbar-width:none;
}
.chipsrow::-webkit-scrollbar{display:none}
.chip{
 display:inline-block; font-size:10px; padding:3px 8px;
 border-radius:20px; background:#F1F2F6; color:var(--mut);
 margin:2px 2px 2px 0; white-space:nowrap;
}
.chip.pub{background:#DCFCE7;color:#15803D}
.chip.err{background:#FEE2E2;color:#B91C1C}
.chip.act{background:#FFEDD5;color:#C2410C}
.chip.pend{background:#FEF9C3;color:#A16207}
.chip.pau{background:#E5E7EB;color:#4B5563}
.chipf{
 display:inline-block; padding:8px 14px; border-radius:20px;
 background:#fff; border:1px solid var(--line);
 font-size:12px; cursor:pointer; white-space:nowrap;
 min-height:34px;
}
.chipf.on{
 background:var(--pri); color:#fff; border-color:var(--pri);
}
.h2{font-size:19px;font-weight:800;margin:4px 0 12px}
.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:10px}
.litem{display:flex;gap:12px;align-items:flex-start}
.litem img{
 width:72px; height:72px; object-fit:cover;
 border-radius:14px; flex-shrink:0;
}
.ltitle{font-weight:700;font-size:14px;line-height:1.35}
.lprice{color:var(--mut);font-size:13px;margin-top:2px}
.lprice b{color:var(--txt);font-size:14px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.abtn{
 width:40px; height:40px; border-radius:12px;
 border:1px solid var(--line); background:#fff;
 display:flex; align-items:center; justify-content:center;
 font-size:16px; cursor:pointer;
}
.abtn:active{opacity:.8}
.abtn.pri{
 background:var(--soft); border-color:transparent;
 color:var(--pri); width:auto; padding:0 14px;
 font-size:13px; font-weight:700; gap:5px;
}
.abtn.danger{background:#FEF2F2;border-color:transparent}
.mgrid{
 display:grid; grid-template-columns:repeat(3,1fr);
 gap:8px; margin:10px 0;
}
.mgrid .m{
 position:relative; aspect-ratio:1; border-radius:12px;
 overflow:hidden; border:1px solid var(--line);
}
.mgrid .m img{width:100%;height:100%;object-fit:cover}
.mgrid .m .star{position:absolute;top:4px;left:4px;font-size:14px}
.mgrid .m .del{
 position:absolute; top:5px; right:5px;
 background:rgba(220,38,38,.92); color:#fff; border:none;
 border-radius:50%; width:26px; height:26px; font-size:12px;
}
.mgrid .m .main{
 position:absolute; bottom:5px; right:5px;
 background:rgba(255,255,255,.95); border:none;
 border-radius:50%; width:28px; height:28px; font-size:13px;
}
.savebar{
 position:sticky; z-index:5; display:flex; gap:8px;
 bottom:calc(66px + env(safe-area-inset-bottom));
 padding:10px 0;
 background:linear-gradient(transparent,var(--bg) 35%);
}
@media(min-width:768px){
 .savebar{bottom:10px}
}
.overlay{
 position:fixed; inset:0; background:rgba(15,23,42,.5);
 z-index:50; display:flex; align-items:flex-end;
 justify-content:center;
}
@media(min-width:768px){.overlay{align-items:center}}
.modal{
 background:#fff; border-radius:20px 20px 0 0; width:100%;
 max-width:560px; max-height:88vh; overflow:auto; padding:18px;
 padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
@media(min-width:768px){.modal{border-radius:20px}}
.modal h3{margin:0 0 10px;font-size:17px;font-weight:800}
.pre{
 background:#F4F5FA; border-radius:12px; padding:10px;
 font-size:12px; white-space:pre-wrap; max-height:180px;
 overflow:auto; font-family:ui-monospace,monospace;
}
#toast{
 position:fixed; left:50%; transform:translateX(-50%);
 z-index:99; top:calc(60px + env(safe-area-inset-top));
 background:#111827; color:#fff; padding:10px 18px;
 border-radius:24px; font-size:13px; opacity:0;
 transition:opacity .25s; pointer-events:none; max-width:90%;
}
#toast.show{opacity:1}
#toast.ok{background:var(--ok)}
#toast.err{background:var(--err)}
.stat{
 background:var(--card); border:1px solid var(--line);
 border-radius:16px; padding:12px; text-align:center;
 box-shadow:var(--sh);
}
.stat .v{font-size:22px;font-weight:800;color:var(--pri)}
.stat .l{font-size:11px;color:var(--mut)}
.sel{width:22px;height:22px;flex-shrink:0;margin-top:2px}
.warn{
 background:#FFFBEB; border:1px solid #FDE68A;
 color:#92400E; border-radius:12px; padding:8px 10px;
 font-size:12px; margin:6px 0;
}
.okbox{
 background:#F0FDF4; border:1px solid #BBF7D0;
 color:#166534; border-radius:12px; padding:8px 10px;
 font-size:12px; margin:6px 0;
}
.errbox{
 background:#FEF2F2; border:1px solid #FECACA;
 color:#991B1B; border-radius:12px; padding:10px;
 font-size:13px; margin:10px 0; white-space:pre-wrap;
}
.ev{
 display:flex; gap:10px; padding:9px 0;
 border-bottom:1px solid var(--line); font-size:13px;
}
.ev .t{
 color:var(--mut); font-size:11px; white-space:nowrap;
 padding-top:2px;
}
.pf{
 display:flex; justify-content:space-between;
 align-items:center; gap:10px; padding:11px 0;
 border-bottom:1px solid var(--line);
}
.pf:last-child{border:none}
.pf .n{font-weight:600;font-size:14px}
.pf .d{font-size:11px;color:var(--mut)}
.dot{
 width:9px; height:9px; border-radius:50%;
 display:inline-block; margin-right:5px;
}
.dot.on{background:var(--ok)}
.dot.off{background:#D1D5DB}
.grp{
 font-size:11px; font-weight:700; color:var(--mut);
 text-transform:uppercase; letter-spacing:.5px;
 margin:12px 0 4px;
}
.step{
 display:flex; gap:10px; align-items:center;
 background:#F8F9FC; border:1px solid var(--line);
 border-radius:12px; padding:10px; margin:6px 0;
 flex-wrap:wrap;
}
.step .num{
 width:26px; height:26px; border-radius:50%;
 background:var(--pri); color:#fff; display:flex;
 align-items:center; justify-content:center;
 font-size:13px; font-weight:700; flex-shrink:0;
}
.pubhero{
 background:linear-gradient(135deg,var(--pri),var(--pri2));
 color:#fff; border-radius:16px; padding:18px;
 margin-bottom:12px;
}
.pubhero .p{font-size:26px;font-weight:800}
body.pubmode header,body.pubmode nav{display:none}
body.pubmode main{padding-bottom:30px}
</style>
</head>
<body>
<header>
 <div class="hwrap">
  <img src="icon.svg" class="logo" alt="">
  <span class="hname">UniBoard</span>
 </div>
 <button class="btn sm" onclick="go('edit',null)">＋ Нове</button>
</header>
<nav class="top" id="topnav"></nav>
<main id="view"></main>
<nav class="bottom" id="botnav"></nav>
<div id="modalRoot"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
