<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0057B7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UniBoard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>UniBoard</title>
<style>
:root{
 --blue:#0057B7; --yellow:#FFD700; --bg:#f5f7fa;
 --card:#fff; --txt:#1e293b; --mut:#64748b;
 --line:#e2e8f0; --red:#dc2626; --green:#16a34a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0; font-size:15px; color:var(--txt);
 background:var(--bg);
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
header{
 position:sticky; top:0; z-index:20; background:var(--blue);
 color:#fff; padding:12px 16px;
 padding-top:calc(12px + env(safe-area-inset-top));
 display:flex; align-items:center; justify-content:space-between;
}
header h1{margin:0;font-size:17px}
header .sub{font-size:11px;opacity:.8}
main{
 max-width:900px; margin:0 auto; padding:14px;
 padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
nav.bottom{
 position:fixed; bottom:0; left:0; right:0; z-index:20;
 background:#fff; border-top:1px solid var(--line);
 display:flex; justify-content:space-around; padding:6px 4px;
 padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
nav.bottom button{
 background:none; border:none; font-size:10px; color:var(--mut);
 display:flex; flex-direction:column; align-items:center;
 gap:2px; padding:4px 8px; position:relative;
}
nav.bottom button .ic{font-size:20px}
nav.bottom button.on{color:var(--blue);font-weight:600}
nav.bottom .badge{
 position:absolute; top:0; right:2px; background:var(--red);
 color:#fff; font-size:9px; min-width:15px; height:15px;
 border-radius:8px; display:flex; align-items:center;
 justify-content:center; padding:0 3px;
}
nav.top{
 display:none; position:sticky; top:0; z-index:20;
 background:var(--blue); padding:0 16px; gap:4px; overflow-x:auto;
}
nav.top button{
 background:none; border:none; color:#fff; opacity:.75;
 padding:12px 14px; font-size:14px; white-space:nowrap;
 border-bottom:3px solid transparent;
}
nav.top button.on{
 opacity:1; border-bottom-color:var(--yellow); font-weight:600;
}
.fab{
 position:fixed; right:16px; z-index:25; width:54px; height:54px;
 border-radius:50%; background:var(--blue); color:#fff;
 font-size:26px; border:none;
 bottom:calc(70px + env(safe-area-inset-bottom));
 box-shadow:0 4px 14px rgba(0,87,183,.4);
}
@media(min-width:768px){
 nav.bottom{display:none}
 main{padding-bottom:30px}
 nav.top{display:flex!important}
 .fab{display:none!important}
}
.card{
 background:var(--card); border:1px solid var(--line);
 border-radius:14px; padding:14px; margin-bottom:12px;
}
.btn{
 display:inline-flex; align-items:center; justify-content:center;
 gap:6px; border:none; border-radius:10px; padding:10px 16px;
 font-size:14px; font-weight:600; cursor:pointer;
 background:var(--blue); color:#fff;
}
.btn:active{opacity:.8}
.btn.sec{background:#eef2f7;color:var(--txt)}
.btn.danger{background:#fee2e2;color:var(--red)}
.btn.green{background:var(--green)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5}
.btn.wide{width:100%}
.input,select,textarea{
 width:100%; border:1px solid var(--line); border-radius:10px;
 padding:10px 12px; font-size:15px; font-family:inherit;
 background:#fff; color:var(--txt);
}
textarea{resize:vertical}
.label{
 display:block; font-size:12px; font-weight:600;
 color:var(--mut); margin:10px 0 4px;
}
.row{display:flex;gap:8px}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:768px){.grid2{grid-template-columns:1fr 1fr 1fr}}
.chip{
 display:inline-block; font-size:10px; padding:3px 8px;
 border-radius:20px; background:#eef2f7; color:var(--mut);
 margin:2px 2px 2px 0;
}
.chip.pub{background:#dcfce7;color:#15803d}
.chip.err{background:#fee2e2;color:var(--red)}
.chip.act{background:#ffedd5;color:var(--orange)}
.chip.pend{background:#fef9c3;color:#a16207}
.chip.pau{background:#e2e8f0;color:#475569}
.chipf{
 display:inline-block; padding:6px 12px; border-radius:20px;
 background:#fff; border:1px solid var(--line); font-size:12px;
 margin:0 6px 6px 0; cursor:pointer;
}
.chipf.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.h2{font-size:19px;font-weight:700;margin:4px 0 12px}
.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:10px}
.litem{display:flex;gap:10px;align-items:flex-start}
.litem img{
 width:64px; height:64px; object-fit:cover;
 border-radius:10px; flex-shrink:0;
}
.ltitle{font-weight:600;font-size:14px;line-height:1.3}
.lprice{color:var(--mut);font-size:13px;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mgrid{
 display:grid; grid-template-columns:repeat(3,1fr);
 gap:8px; margin:10px 0;
}
.mgrid .m{
 position:relative; aspect-ratio:1; border-radius:10px;
 overflow:hidden; border:1px solid var(--line);
}
.mgrid .m img{width:100%;height:100%;object-fit:cover}
.mgrid .m .star{position:absolute;top:4px;left:4px;font-size:14px}
.mgrid .m .del{
 position:absolute; top:4px; right:4px;
 background:rgba(220,38,38,.9); color:#fff; border:none;
 border-radius:50%; width:24px; height:24px; font-size:12px;
}
.mgrid .m .main{
 position:absolute; bottom:4px; right:4px;
 background:rgba(255,255,255,.95); border:none;
 border-radius:50%; width:26px; height:26px; font-size:13px;
}
.overlay{
 position:fixed; inset:0; background:rgba(15,23,42,.55);
 z-index:50; display:flex; align-items:flex-end;
 justify-content:center;
}
@media(min-width:768px){.overlay{align-items:center}}
.modal{
 background:#fff; border-radius:18px 18px 0 0; width:100%;
 max-width:560px; max-height:88vh; overflow:auto; padding:18px;
 padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
@media(min-width:768px){.modal{border-radius:18px}}
.modal h3{margin:0 0 10px;font-size:17px}
.pre{
 background:#f1f5f9; border-radius:10px; padding:10px;
 font-size:12px; white-space:pre-wrap; max-height:180px;
 overflow:auto; font-family:ui-monospace,monospace;
}
#toast{
 position:fixed; left:50%; transform:translateX(-50%); z-index:99;
 top:calc(14px + env(safe-area-inset-top));
 background:#1e293b; color:#fff; padding:10px 18px;
 border-radius:24px; font-size:13px; opacity:0;
 transition:opacity .25s; pointer-events:none; max-width:90%;
}
#toast.show{opacity:1}
#toast.ok{background:var(--green)}
#toast.err{background:var(--red)}
.stat{
 background:var(--card); border:1px solid var(--line);
 border-radius:14px; padding:12px; text-align:center;
}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:11px;color:var(--mut)}
.sel{width:22px;height:22px;flex-shrink:0;margin-top:2px}
.warn{
 background:#fff7ed; border:1px solid #fed7aa; color:#9a3412;
 border-radius:10px; padding:8px 10px; font-size:12px;
 margin:6px 0;
}
.okbox{
 background:#f0fdf4; border:1px solid #bbf7d0; color:#166534;
 border-radius:10px; padding:8px 10px; font-size:12px;
 margin:6px 0;
}
.errbox{
 background:#fee2e2; border:1px solid #fca5a5; color:#991b1b;
 border-radius:10px; padding:10px; font-size:13px;
 margin:10px 0; white-space:pre-wrap;
}
.ev{
 display:flex; gap:10px; padding:9px 0;
 border-bottom:1px solid var(--line); font-size:13px;
}
.ev .t{
 color:var(--mut); font-size:11px; white-space:nowrap;
 padding-top:2px;
}
.pf{
 display:flex; justify-content:space-between;
 align-items:center; gap:10px; padding:10px 0;
 border-bottom:1px solid var(--line);
}
.pf:last-child{border:none}
.pf .n{font-weight:600;font-size:14px}
.pf .d{font-size:11px;color:var(--mut)}
.dot{
 width:9px; height:9px; border-radius:50%;
 display:inline-block; margin-right:5px;
}
.dot.on{background:var(--green)}
.dot.off{background:#cbd5e1}
.grp{
 font-size:11px; font-weight:700; color:var(--mut);
 text-transform:uppercase; letter-spacing:.5px;
 margin:12px 0 4px;
}
.step{
 display:flex; gap:10px; align-items:center;
 background:#f8fafc; border:1px solid var(--line);
 border-radius:10px; padding:10px; margin:6px 0;
 flex-wrap:wrap;
}
.step .num{
 width:26px; height:26px; border-radius:50%;
 background:var(--blue); color:#fff; display:flex;
 align-items:center; justify-content:center;
 font-size:13px; font-weight:700; flex-shrink:0;
}
.pubhero{
 background:linear-gradient(135deg,var(--blue),#0077cc);
 color:#fff; border-radius:16px; padding:18px;
 margin-bottom:12px;
}
.pubhero .p{font-size:26px;font-weight:800}
body.pubmode header,body.pubmode nav,body.pubmode .fab{
 display:none;
}
body.pubmode main{padding-bottom:30px}
</style>
</head>
<body>
<header>
 <div>
  <h1>🇺 UniBoard</h1>
  <div class="sub">оголошення всюди — з одного місця</div>
 </div>
 <button class="btn sm"
  style="background:rgba(255,255,255,.18)"
  onclick="go('edit',null)">＋ Нове</button>
</header>
<nav class="top" id="topnav"></nav>
<main id="view"></main>
<button class="fab" onclick="go('edit',null)">＋</button>
<nav class="bottom" id="botnav"></nav>
<div id="modalRoot"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
